name: Build DeadFrameRemover APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android NDK & CMake
        run: |
          yes | sdkmanager --install "ndk;26.1.10909125" "cmake;3.22.1"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.7'

      - name: Prepare Gradle Wrapper
        run: |
          gradle wrapper --gradle-version 8.7 --distribution-type bin
          chmod +x ./gradlew

      - name: Download Official 4KB Arthenica FFmpegKit AAR
        run: |
          mkdir -p app/libs
          curl -fL -o app/libs/ffmpeg-kit-full-6.0-2.aar https://maven.aliyun.com/repository/public/com/arthenica/ffmpeg-kit-full/6.0-2/ffmpeg-kit-full-6.0-2.aar
          ls -lh app/libs/

      - name: Build Release APK
        run: ./gradlew assembleRelease --stacktrace

      - name: Upload Release APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: DeadFrameRemover-Release-APK
          path: app/build/outputs/apk/release/*.apk

      - name: Prepare Release APK Name
        run: |
          RELEASE_APK=$(ls app/build/outputs/apk/release/*.apk | head -n 1)
          cp "$RELEASE_APK" app/build/outputs/apk/release/DeadFrameRemover-v1.0.0-4kb.apk

      - name: Publish GitHub Release
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.0-4kb
          name: "DeadFrameRemover v1.0.0 (4KB Page Compatible)"
          body: "Production build with verified 4KB-compatible Arthenica FFmpegKit (pre-16KB) and crash-resilient C++ NDK MediaCodec engine."
          files: app/build/outputs/apk/release/DeadFrameRemover-v1.0.0-4kb.apk
